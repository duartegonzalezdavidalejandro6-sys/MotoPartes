<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{ titulo }} — MotoPartes</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="topbar">
  <div class="topbar-logo">MOTO<span>PARTES</span></div>
</div>
<div class="content">
  <div class="seccion-header">
    <span class="seccion-titulo">{{ titulo }}</span>
    <a href="{% url 'panel_empleado' %}" class="btn btn-dark">← Volver</a>
  </div>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-card">
      <div class="form-body">
        <div class="form-group full">
          <label class="form-label">Nombre del Producto *</label>
          <input class="form-control" type="text" name="nombreProducto" value="{{ producto.nombreProducto|default:'' }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Precio *</label>
          <input class="form-control" type="number" step="0.01" name="precioProducto" value="{{ producto.precioProducto|default:'0' }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Stock</label>
          <input class="form-control" type="number" name="stock" value="{{ producto.stock|default:'0' }}">
        </div>
        <div class="form-group">
          <label class="form-label">Categoría</label>
          <select class="form-control" name="idCategoria_Producto">
            <option value="">-- Sin categoría --</option>
            {% for cat in categorias %}
            <option value="{{ cat.pk }}" {% if producto.idCategoria_Producto.pk == cat.pk %}selected{% endif %}>{{ cat.nombreCategoria }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Estado</label>
          <select class="form-control" name="estadoProducto">
            <option value="Disponible" {% if producto.estadoProducto == 'Disponible' %}selected{% endif %}>Disponible</option>
            <option value="Agotado" {% if producto.estadoProducto == 'Agotado' %}selected{% endif %}>Agotado</option>
            <option value="Descontinuado" {% if producto.estadoProducto == 'Descontinuado' %}selected{% endif %}>Descontinuado</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Imagen</label>
          <input class="form-control" type="file" name="imagen" accept="image/*">
        </div>
        <div class="form-group full">
          <label class="form-label">Descripción</label>
          <textarea class="form-control" name="descripcion" rows="3">{{ producto.descripcion|default:'' }}</textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'panel_empleado' %}" class="btn btn-dark">Cancelar</a>
      </div>
    </div>
  </form>
</div>
</body>
</html>
