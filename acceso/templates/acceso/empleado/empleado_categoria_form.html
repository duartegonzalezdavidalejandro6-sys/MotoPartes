{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{ titulo }} — MotoPartes</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'acceso/css/panel_empleado.css' %}">
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">MOTO<span>PARTES</span></div>
  <div class="topbar-right">
    Hola, <strong>{{ request.user.get_full_name|default:request.user.username }}</strong>
    <div class="divider"></div>
    <a href="{% url 'empleado_categorias' %}" class="btn btn-salir btn-sm">← Volver</a>
  </div>
</div>

{% if messages %}
<div class="mensajes">
  {% for message in messages %}
  <div class="mensaje {{ message.tags }}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}

<div class="content" style="max-width:600px;">
  <div class="seccion-header">
    <span class="seccion-titulo">{{ titulo }}</span>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="tabla-wrap" style="padding:24px;">

      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:6px;">
          Nombre *
        </label>
        <input type="text" name="nombreCategoria"
               value="{{ categoria.nombreCategoria|default:'' }}"
               required
               style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--texto);padding:10px 14px;border-radius:4px;font-family:'Barlow',sans-serif;font-size:14px;outline:none;">
      </div>

      <div style="margin-bottom:24px;">
        <label style="display:block;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:6px;">
          Descripción
        </label>
        <textarea name="descripcion" rows="3"
                  style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--texto);padding:10px 14px;border-radius:4px;font-family:'Barlow',sans-serif;font-size:14px;outline:none;resize:vertical;">{{ categoria.descripcion|default:'' }}</textarea>
      </div>

      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'empleado_categorias' %}" class="btn btn-dark">Cancelar</a>
      </div>

    </div>
  </form>
</div>

</body>
</html>
