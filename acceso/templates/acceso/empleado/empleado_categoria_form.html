{% extends 'acceso/empleado/base_empleado.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block nav_categorias %}activo{% endblock %}
{% block topbar_titulo %}{{ titulo }}{% endblock %}

{% block content %}
<div style="max-width:600px;">
  <div class="seccion-header">
    <span class="seccion-titulo">{{ titulo }}</span>
    <a href="{% url 'empleado_categorias' %}" class="btn btn-dark">← Volver</a>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="tabla-wrap" style="padding:24px;">
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:6px;">Nombre *</label>
        <input type="text" name="nombreCategoria" value="{{ categoria.nombreCategoria|default:'' }}" required
               style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--texto);padding:10px 14px;border-radius:4px;font-family:'Barlow',sans-serif;font-size:14px;outline:none;">
      </div>
      <div style="margin-bottom:24px;">
        <label style="display:block;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:6px;">Descripción</label>
        <textarea name="descripcion" rows="3"
                  style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--texto);padding:10px 14px;border-radius:4px;font-family:'Barlow',sans-serif;font-size:14px;outline:none;resize:vertical;">{{ categoria.descripcion|default:'' }}</textarea>
      </div>
      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'empleado_categorias' %}" class="btn btn-dark">Cancelar</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
